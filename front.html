<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XinWiki · 工作空间 Wiki 知识分析系统</title>
<style>
:root{
  --bg:#fbfcfe;--bg-soft:#f4f6fb;--ink:#1a1d24;--muted:#697086;--faint:#9aa1b4;
  --line:#e9ecf3;--line2:#dfe3ee;--panel:#fff;
  --indigo:#5b6ef5;--indigo-soft:#eef0ff;--violet:#8b5cf6;--violet-soft:#f3edff;
  --sky:#38bdf8;--sky-soft:#e8f7ff;--teal:#2dd4bf;--teal-soft:#e4fbf6;
  --amber:#f59e0b;--amber-soft:#fff4e0;--rose:#fb7185;--rose-soft:#ffeef1;
  --emerald:#34d399;--emerald-soft:#e6faf0;--graph:#0b0e17;
  --shadow:0 24px 60px rgba(40,46,80,.10);--shadow-sm:0 8px 28px rgba(40,46,80,.07);
  --glow:0 0 40px rgba(91,110,245,.25);
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 600px at 88% -8%,rgba(139,92,246,.10),transparent 60%),
    radial-gradient(900px 500px at 6% -6%,rgba(56,189,248,.10),transparent 58%),
    radial-gradient(800px 600px at 50% 120%,rgba(45,212,191,.08),transparent 55%),
    var(--bg);
}
button,input,textarea,select{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d4d9e6;border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#bcc3d6;background-clip:content-box}

.app{height:100vh;display:grid;grid-template-rows:68px 1fr}
.topbar{
  display:flex;align-items:center;gap:18px;padding:0 26px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;min-width:240px}
.logo{
  width:38px;height:38px;border-radius:12px;position:relative;
  background:linear-gradient(135deg,var(--indigo),var(--violet) 55%,var(--sky));box-shadow:var(--glow);
}
.logo:before{
  content:"";position:absolute;inset:0;border-radius:12px;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),transparent 50%);
}
.logo:after{
  content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);
  border:2px solid rgba(255,255,255,.92);border-radius:50%;
}
.brand-title b{font-size:16px;font-weight:680;letter-spacing:-.02em;display:block;line-height:1.1}
.brand-title small{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.04em}

.search{flex:1;max-width:540px;position:relative}
.search input{
  width:100%;border:1px solid var(--line2);background:var(--bg-soft);border-radius:14px;
  padding:11px 44px 11px 40px;outline:none;color:var(--ink);font-size:13px;transition:.2s;
}
.search input:focus{border-color:var(--indigo);background:#fff;box-shadow:0 0 0 4px rgba(91,110,245,.10)}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:15px}
.search .kbd{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line2);border-radius:6px;padding:2px 6px;
}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{
  display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
  background:var(--bg-soft);border:1px solid var(--line);border-radius:99px;padding:8px 12px;
}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 8px var(--emerald)}

.main{display:grid;grid-template-columns:84px 320px 1fr;min-height:0}
.rail{padding:18px 12px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line)}
.nav-btn{
  height:60px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:var(--faint);transition:.2s;
}
.nav-btn svg{width:21px;height:21px}
.nav-btn span{font-size:11px;font-weight:550}
.nav-btn:hover{background:#fff;box-shadow:var(--shadow-sm);color:var(--muted)}
.nav-btn.active{background:linear-gradient(160deg,var(--indigo),var(--violet));color:#fff;box-shadow:0 12px 28px rgba(91,110,245,.32)}

.left{border-right:1px solid var(--line);background:rgba(255,255,255,.55);overflow:auto;backdrop-filter:blur(10px)}
.left-head{
  padding:22px 22px 16px;position:sticky;top:0;z-index:5;background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.left-head h3{font-size:18px;letter-spacing:-.02em}
.left-head p{font-size:11px;color:var(--faint);margin-top:4px;font-family:var(--mono)}
.left-body{padding:16px}

.stage{overflow:auto;min-width:0}
.stage-inner{max-width:1240px;margin:0 auto;padding:34px 44px 90px}
.view{display:none}
.view.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}
.page-title h1{font-size:32px;letter-spacing:-.035em;line-height:1.1;font-weight:680}
.page-title .lead{color:var(--muted);margin-top:10px;font-size:14px;max-width:860px;line-height:1.65}
.section{margin-top:28px}
.section h2{
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:14px;
  display:flex;align-items:center;gap:12px;font-family:var(--mono);
}
.section h2:after{content:"";height:1px;background:var(--line);flex:1}

.card{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card.pad{padding:22px}
.grid{display:grid;gap:16px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1180px){
  .main{grid-template-columns:80px 280px 1fr}
  .grid.two,.grid.three,.grid.four{grid-template-columns:1fr}
}

.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;
  background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);font-size:12px;
}
.tag.indigo{background:var(--indigo-soft);border-color:#d8ddff;color:var(--indigo)}
.tag.violet{background:var(--violet-soft);border-color:#e2d6ff;color:var(--violet)}
.tag.teal{background:var(--teal-soft);border-color:#c6f3ea;color:#0d9488}
.tag.amber{background:var(--amber-soft);border-color:#fbe3b3;color:#b45309}
.tag.rose{background:var(--rose-soft);border-color:#ffd2da;color:#be123c}
.tag.emerald{background:var(--emerald-soft);border-color:#c4f1da;color:#059669}
.tag.dark{background:#13182a;border-color:#23293f;color:#a9b4ff}

.btn{
  background:linear-gradient(160deg,var(--indigo),var(--violet));color:#fff;border-radius:12px;padding:10px 16px;
  font-weight:600;font-size:13px;box-shadow:0 10px 22px rgba(91,110,245,.25);transition:.18s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(91,110,245,.32)}
.btn.secondary{background:#fff;color:var(--muted);border:1px solid var(--line2);box-shadow:none}
.btn.secondary:hover{border-color:var(--indigo);color:var(--indigo);box-shadow:none}
.btn.ghost{background:transparent;color:var(--indigo);box-shadow:none;border:1px solid #d4daff}
.btn.teal{background:linear-gradient(160deg,var(--teal),#0ea5e9)}
.btn.rose{background:linear-gradient(160deg,var(--rose),#f97316)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}

.file-card,.wiki-item,.entity-card,.proc-card{
  padding:15px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.7);margin-bottom:11px;transition:.18s;
}
.file-card,.wiki-item,.entity-card{cursor:pointer}
.file-card:hover,.wiki-item:hover,.entity-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--line2)}
.file-card.active,.wiki-item.active,.entity-card.active{border-color:var(--indigo);background:var(--indigo-soft)}
.file-top{display:flex;align-items:center;gap:11px}
.file-icon{
  width:36px;height:36px;border-radius:11px;background:linear-gradient(150deg,var(--indigo-soft),var(--violet-soft));
  color:var(--indigo);display:grid;place-items:center;flex:none;
}
.file-icon svg{width:18px;height:18px}
.file-name{font-weight:600;font-size:13px;line-height:1.35}
.file-meta{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
.mini{
  font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:7px;
  background:var(--bg-soft);border:1px solid var(--line);color:var(--faint);
}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--teal));border-radius:99px}

table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;vertical-align:top}
th{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}

.kpi{
  padding:20px;border-radius:var(--radius);border:1px solid var(--line);
  background:linear-gradient(170deg,#fff,var(--bg-soft));position:relative;overflow:hidden;
}
.kpi:before{
  content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,rgba(91,110,245,.12),transparent 70%);
}
.kpi .val{
  font-size:28px;font-weight:720;letter-spacing:-.03em;
  background:linear-gradient(120deg,var(--indigo),var(--violet));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.kpi .label{font-size:12px;color:var(--muted);margin-top:6px}

.upload-zone{
  border:1.5px dashed var(--line2);border-radius:16px;background:rgba(255,255,255,.6);
  padding:22px;text-align:center;cursor:pointer;margin-bottom:16px;transition:.2s;
}
.upload-zone:hover{border-color:var(--indigo);background:var(--indigo-soft)}
.upload-zone .uz-ic{font-size:26px;color:var(--indigo);margin-bottom:8px}
.upload-zone b{font-size:13px}
.upload-zone p{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:5px}

.proc-card{overflow:hidden}
.pc-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pc-ft{font-family:var(--mono);font-size:9px;padding:3px 7px;border-radius:6px;background:#13182a;color:#a9b4ff}
.pc-name{font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-state{font-family:var(--mono);font-size:10px;color:var(--indigo)}
.stages{display:flex;align-items:flex-start;margin-top:6px}
.stg{flex:1;text-align:center;position:relative}
.stg:not(:last-child):after{content:"";position:absolute;top:10px;left:50%;right:-50%;height:2px;background:var(--line2);z-index:1}
.stg.done:not(:last-child):after{background:linear-gradient(90deg,var(--indigo),var(--teal))}
.ring{
  width:21px;height:21px;border-radius:50%;border:2px solid var(--line2);background:#fff;margin:0 auto 6px;
  display:grid;place-items:center;font-size:10px;color:var(--faint);position:relative;z-index:2;
}
.stg.done .ring{border-color:var(--teal);background:var(--teal);color:#fff}
.stg.active .ring{border-color:var(--indigo);color:var(--indigo);animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,110,245,.3)}70%{box-shadow:0 0 0 9px rgba(91,110,245,0)}100%{box-shadow:0 0 0 0 rgba(91,110,245,0)}}
.stg .lbl{font-family:var(--mono);font-size:8px;color:var(--faint);line-height:1.3}
.build-wiki{width:100%;margin-top:14px;display:none}
.build-wiki.show{display:block}

.parse-step{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.step-dot{width:26px;height:26px;border-radius:50%;background:var(--teal-soft);color:#0d9488;display:grid;place-items:center;font-size:13px;flex:none}
.step-text b{font-size:13px}
.step-text p{font-size:12px;color:var(--faint);margin-top:3px;line-height:1.5}
.source-layout{display:grid;grid-template-columns:1fr 360px;gap:18px}
@media(max-width:1180px){.source-layout{grid-template-columns:1fr}}
.source-hero{
  border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(170deg,#fff,var(--bg-soft));
  padding:30px;text-align:center;position:relative;overflow:hidden;
}
.source-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(400px 200px at 50% 0,rgba(139,92,246,.10),transparent 70%)}
.source-hero svg{width:40px;height:40px;color:var(--indigo);margin-bottom:10px;position:relative}
.source-hero h3{font-size:18px;position:relative}
.source-hero p{color:var(--muted);font-size:13px;margin-top:6px;position:relative}
.wiki-md h3{font-size:16px;margin:18px 0 8px}
.wiki-md ul{margin:0 0 4px 20px}
.wiki-md li{font-size:14px;color:var(--muted);line-height:1.8}
.entity-chip{
  display:inline-flex;align-items:center;gap:7px;margin:4px 6px 4px 0;padding:7px 12px;border-radius:99px;
  border:1px solid var(--line);background:#fff;font-size:12px;color:var(--muted);
}
.entity-chip i{width:8px;height:8px;border-radius:50%}

.ontology-wrap{
  height:620px;position:relative;overflow:hidden;border-radius:22px;border:1px solid #1c2336;
  background:
    radial-gradient(circle at 50% 40%,rgba(91,110,245,.10),transparent 60%),
    linear-gradient(rgba(120,140,255,.04) 1px,transparent 1px) 0 0/36px 36px,
    linear-gradient(90deg,rgba(120,140,255,.04) 1px,transparent 1px) 0 0/36px 36px,
    var(--graph);
  box-shadow:0 30px 70px rgba(8,12,22,.30);
}
#ontoSvg{width:100%;height:100%}
.onto-panel,.onto-detail{
  position:absolute;background:rgba(17,21,32,.82);border:1px solid #262d44;border-radius:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);padding:18px;color:#dfe4f5;backdrop-filter:blur(14px);
}
.onto-panel{right:18px;top:18px;width:280px}
.onto-detail{left:18px;bottom:18px;width:340px}
.onto-panel h3,.onto-detail h3{font-size:15px}
.onto-panel p,.onto-detail p{font-size:12px;color:#9aa2c0;margin-top:6px;line-height:1.55}
.node-label{font-family:var(--mono);font-size:11px;fill:#eef0ff;font-weight:700}
.node-type{font-family:var(--mono);font-size:8.5px;fill:#9aa6cc}
.edge-label{font-family:var(--mono);font-size:9px;fill:#7d88b5}

.expert-layout{display:grid;grid-template-columns:1fr 380px;gap:18px}
@media(max-width:1180px){.expert-layout{grid-template-columns:1fr}}
.expert-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px}
.expert-card select,.expert-card textarea,.expert-card input{
  width:100%;border:1px solid var(--line2);border-radius:12px;padding:11px;background:var(--bg-soft);outline:none;margin-top:8px;
}
.expert-card textarea{min-height:96px;resize:vertical}
.expert-badge{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
  border-radius:999px;padding:4px 8px;background:#13182a;color:#a9b4ff;
}
.weight-bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.weight-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--indigo),var(--teal))}

.focus-group{margin-bottom:18px}
.focus-group h4{font-size:12px;font-family:var(--mono);color:var(--muted);margin-bottom:10px;letter-spacing:.04em}
.focus-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;border:1px solid var(--line);
  background:#fff;margin-bottom:7px;cursor:pointer;transition:.16s;
}
.focus-item:hover{border-color:var(--indigo)}
.focus-item.on{background:var(--indigo-soft);border-color:#cdd4ff}
.chk{
  width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;
  flex:none;transition:.16s;color:#fff;font-size:11px;
}
.focus-item.on .chk{background:var(--indigo);border-color:var(--indigo)}
.focus-item .fname{font-size:13px;flex:1}

.ask-layout{display:grid;grid-template-columns:1fr 360px;gap:18px}
@media(max-width:1180px){.ask-layout{grid-template-columns:1fr}}
.chat-shell{
  background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  min-height:640px;display:flex;flex-direction:column;overflow:hidden;
}
.chat-head{
  padding:18px 20px;border-bottom:1px solid var(--line);background:linear-gradient(170deg,var(--bg-soft),#fff);
  display:flex;align-items:center;justify-content:space-between;
}
.chat-body{flex:1;padding:24px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.msg{max-width:88%;padding:14px 16px;border-radius:18px;font-size:14px;line-height:1.7}
.msg.user{align-self:flex-end;background:linear-gradient(160deg,var(--indigo),var(--violet));color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--bg-soft);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.refuse{align-self:flex-start;background:var(--rose-soft);border:1px solid #ffd2da;color:#7f1d1d;border-bottom-left-radius:6px}
.msg .cite{display:inline-flex;margin-top:9px;font-size:11px;color:var(--indigo);font-family:var(--mono)}
.msg.refuse .cite{color:#be123c}
.streaming-cursor{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.chat-input{padding:16px;border-top:1px solid var(--line);display:flex;gap:10px;background:#fff}
.chat-input input{flex:1;border:1px solid var(--line2);border-radius:99px;padding:13px 18px;outline:none;background:var(--bg-soft)}
.chat-input input:focus{border-color:var(--indigo);background:#fff}
.side-tool{display:flex;flex-direction:column;gap:16px}
.side-tool textarea{
  width:100%;min-height:88px;resize:vertical;border:1px solid var(--line2);border-radius:12px;
  padding:12px;background:var(--bg-soft);outline:none;color:var(--ink);font-size:13px;
}
.side-tool textarea:focus{border-color:var(--indigo);background:#fff}
.side-tool select{width:100%;border:1px solid var(--line2);border-radius:11px;padding:11px;margin-top:8px;background:var(--bg-soft);outline:none}
.timeline{border-left:2px solid var(--line2);margin-left:6px;padding-left:18px}
.tl{position:relative;margin-bottom:16px}
.tl:before{
  content:"";position:absolute;left:-25px;top:4px;width:11px;height:11px;border-radius:50%;
  background:linear-gradient(var(--indigo),var(--violet));box-shadow:0 0 0 4px rgba(91,110,245,.12);
}
.tl time{font-family:var(--mono);font-size:11px;color:var(--indigo)}
.tl p{font-size:12px;color:var(--muted);line-height:1.55;margin-top:4px}

.scope-box,.chart-boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:1180px){.scope-box,.chart-boxes{grid-template-columns:repeat(2,1fr)}}
.scope,.chart-choice{
  padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:.18s;
}
.scope:hover,.scope.active,.chart-choice:hover,.chart-choice.active{background:var(--indigo-soft);border-color:#cdd4ff}
.scope b,.chart-choice b{font-size:14px}
.scope p,.chart-choice p{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.report-types{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:1180px){.report-types{grid-template-columns:1fr}}
.rt-card{
  padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:.18s;
  display:flex;gap:12px;align-items:flex-start;
}
.rt-card:hover,.rt-card.active{border-color:var(--indigo);background:var(--indigo-soft)}
.rt-ic{
  width:34px;height:34px;border-radius:10px;background:linear-gradient(150deg,var(--violet-soft),var(--sky-soft));
  color:var(--violet);display:grid;place-items:center;flex:none;font-size:17px;
}
.rt-card b{font-size:14px}
.rt-card p{font-size:12px;color:var(--muted);margin-top:4px}
.model-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.model-pill{
  border:1px solid var(--line2);background:#fff;border-radius:99px;padding:8px 13px;color:var(--muted);
  font-size:12px;cursor:pointer;font-family:var(--mono);transition:.16s;
}
.model-pill.active{background:#13182a;color:#a9b4ff;border-color:#23293f}
.gen-actions{display:flex;gap:10px;flex-wrap:wrap}
.output{margin-top:20px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.output-head{
  padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(170deg,var(--bg-soft),#fff);gap:16px;
}
.output-body{padding:24px}
.chart-card{
  border:1px solid var(--line);border-radius:16px;background:linear-gradient(170deg,#fff,var(--bg-soft));
  padding:18px;margin:18px 0;
}
.chart-title{font-weight:650;margin-bottom:4px}
.chart-sub{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:14px}
.chart-card svg{width:100%;height:auto}
.axis{font-family:var(--mono);font-size:10px;fill:#8b93ab}
.bar-label{font-family:var(--mono);font-size:10px;fill:#3a4156}
.grid-line{stroke:var(--line2);stroke-width:1}

.report-hero{
  position:relative;overflow:hidden;border-radius:24px;border:1px solid var(--line);
  background:
    radial-gradient(520px 260px at 86% 0%,rgba(139,92,246,.16),transparent 68%),
    radial-gradient(460px 240px at 6% 0%,rgba(56,189,248,.14),transparent 68%),
    linear-gradient(160deg,#fff,var(--bg-soft));
  box-shadow:var(--shadow);padding:28px;
}
.report-hero h3{font-size:22px;letter-spacing:-.03em}
.report-hero p{color:var(--muted);line-height:1.75;margin-top:8px;max-width:820px;font-size:14px}
.report-hero-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
@media(max-width:1180px){.report-hero-grid{grid-template-columns:repeat(2,1fr)}}
.report-metric{
  border:1px solid rgba(223,227,238,.9);background:rgba(255,255,255,.72);
  border-radius:16px;padding:16px;backdrop-filter:blur(12px);
}
.report-metric b{
  display:block;font-size:22px;letter-spacing:-.03em;
  background:linear-gradient(120deg,var(--indigo),var(--violet));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.report-metric span{display:block;margin-top:5px;font-size:12px;color:var(--muted)}
.chart-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:18px}
@media(max-width:1180px){.chart-grid{grid-template-columns:1fr}}
.chart-card.enhanced{position:relative;overflow:hidden;padding:20px}
.chart-card.enhanced:before{
  content:"";position:absolute;right:-80px;top:-80px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(91,110,245,.13),transparent 70%);
}
.insight-box{
  border:1px solid var(--line);background:linear-gradient(170deg,#fff,var(--bg-soft));
  border-radius:16px;padding:16px;
}
.insight-box b{font-size:14px}
.insight-box ul{margin:10px 0 0 18px}
.insight-box li{color:var(--muted);font-size:12.5px;line-height:1.75}
.ppt-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
@media(max-width:1180px){.ppt-board{grid-template-columns:1fr}}
.ppt-slide-card{
  min-height:190px;border:1px solid var(--line);border-radius:18px;
  background:radial-gradient(260px 120px at 100% 0,rgba(91,110,245,.10),transparent 70%),linear-gradient(170deg,#fff,var(--bg-soft));
  padding:18px;position:relative;overflow:hidden;
}
.ppt-slide-card:after{
  content:"";position:absolute;left:18px;right:18px;bottom:16px;height:4px;border-radius:99px;
  background:linear-gradient(90deg,var(--indigo),var(--violet),var(--teal));opacity:.65;
}
.ppt-slide-no{font-family:var(--mono);font-size:10px;color:var(--faint);margin-bottom:10px}
.ppt-slide-card h4{font-size:16px;letter-spacing:-.02em}
.ppt-slide-card p{color:var(--muted);font-size:12.5px;line-height:1.7;margin-top:8px}
.ppt-mini-chart{margin-top:14px;height:54px;display:flex;align-items:end;gap:8px}
.ppt-mini-chart i{flex:1;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--indigo),var(--violet));opacity:.82}
.report-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}
.report-section-title h3{font-size:18px;letter-spacing:-.02em}
.report-section-title span{font-family:var(--mono);font-size:11px;color:var(--faint)}
.source-footnotes{border-top:1px solid var(--line);margin-top:22px;padding-top:16px}
.source-footnotes p{font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.7}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:#13182a;color:#fff;border-radius:99px;padding:12px 20px;box-shadow:0 18px 44px rgba(0,0,0,.24);
  opacity:0;transition:.28s;z-index:100;font-size:13px;
}
.toast.show{opacity:1;transform:translateX(-50%)}
.auth-overlay{
  position:fixed;inset:0;background:rgba(12,18,34,.48);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;z-index:120;

.auth-overlay.show{display:flex}
.auth-card{

.auth-card h3{font-size:24px;letter-spacing:-.03em}

.auth-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.auth-field input{

.auth-field input:focus{border-color:var(--indigo);background:#fff;box-shadow:0 0 0 4px rgba(91,110,245,.10)}

.auth-hint{font-size:12px;color:var(--faint);margin-top:12px}
.auth-status{font-size:12px;color:var(--muted);margin-top:14px;min-height:18px}

const PARSE_STAGES=[
  {id:'upload',lbl:'上传'},
  {id:'parse_content',lbl:'解析\\n正文'},
  {id:'structure_markdown',lbl:'结构化\\nMD'},
  {id:'extract_entities',lbl:'抽取\\n实体'},

];
function fileDownloadName(name,ext='.md'){
  const base=String(name||'source').replace(/\.[^.]+$/,'').trim()||'source';
  return `${base}${ext}`;
}
function downloadTextFile(text,fileName,mime='text/plain;charset=utf-8'){
  const blob=new Blob([text],{type:mime});
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.download=fileName;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),0);
}
function stageIndexForJob(stage){
  const idx=PARSE_STAGES.findIndex(item=>item.id===stage);
  return idx>=0?idx:0;
}
function normalizeProcJobs(items=[]){
  return (items||[]).map(job=>{
    const source=files.find(file=>file.id===job.sourceId)||{};
    return {
      id:source.id||job.sourceId||job.id,
      sourceId:job.sourceId||source.id||job.id,
      jobId:job.id,
      ft:source.type||'上传文档',
      name:source.name||source.title||job.sourceId||job.id,
      stage:stageIndexForJob(job.stage),
      stageKey:job.stage||'upload',
      done:job.status==='completed',
      built:!!source.wikiBuilt,
      progress:Number(job.progress||0),
      status:job.status||'pending'
    };
  });
}
function focusCount(){
  let n=0;
  Object.values(focusList).forEach(g=>g.forEach(x=>{if(x[1])n++}));

}
function highWeightCount(){return ontoNodes.filter(n=>(n.expertWeight||1)>=4).length}
function esc(s){
  return String(s||'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m]));
}
function hasAuth(){return !!currentUser}
function wikiMapFromArray(items){

function cloneFocusList(items){

function renderChatMessage(msg){
  const kind=msg.role==='user'?'user':((msg.citations||[]).length?'ai':'refuse');
  const citations=(msg.citations||[]).map(esc).join(' · ');
  return `<div class="msg ${kind}">
    ${esc(msg.content||'')}<br>
    <span class="cite">${citations?`引用：${citations}`:'grounded-only'}</span>
  </div>`;
}
async function api(url,options={}){
  const opts={credentials:'include',...options};
  if(opts.body && !(opts.body instanceof FormData)){
    opts.headers={'Content-Type':'application/json',...(opts.headers||{})};
  }
  const res=await fetch(url,opts);
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||'请求失败');
  return data;
}

function hydrateState(data){
  currentUser=data.user||null;
  currentWorkspace=data.workspace||null;
  files=data.files||[];
  sourceMarkdownCache=Object.fromEntries(files.map(file=>[file.id,file.markdown||'']));
  wikiPages=wikiMapFromArray(data.wikiPages||[]);
  ontoNodes=data.ontologyNodes||[];
  ontoEdges=data.ontologyEdges||[];
  expertInjections=data.expertInjections||[];
  qaRecords=data.qaRecords||[];
  memories=(data.memories||[]).map(m=>({time:m.time,text:m.text,period:m.period}));
  focusList=cloneFocusList(data.focuses);
  chatThread=data.chatThread||null;
  chatMessages=data.chatMessages||[];
  procJobs=normalizeProcJobs(data.jobs||[]);
  const lastAssistant=[...chatMessages].reverse().find(m=>m.role==='assistant');
  if(lastAssistant){
    lastAnswer=lastAssistant.content||'';
    lastCitations=lastAssistant.citations||[];
  }
  if(files.length && !files.find(f=>f.id===activeFile)) activeFile=files[0].id;
  const wikiList=Object.values(wikiPages);
  if(wikiList.length && !wikiPages[activeWiki]) activeWiki=wikiList[0].id;
  if(ontoNodes.length && !ontoNodes.find(n=>n.id===activeNode)) activeNode=ontoNodes[0].id;
  renderTopbarState();
}

/* ---------------- Upload Pipeline ---------------- */
async function handleFiles(list){
  if(!list?.length) return;
  const formData=new FormData();
  [...list].forEach(file=>formData.append('files',file));
  try{
    const result=await api('/api/sources/upload-and-build',{method:'POST',body:formData});
    await loadBootstrap();
    const source=result.sources?.[0];
    const wikiPage=result.wikiPages?.[0];
    if(source) activeFile=source.id;
    if(wikiPage) activeWiki=wikiPage.id;
    switchNav('sources');
    toast(`已上传并构建 ${list.length} 个文件`);
  }catch(err){
    toast(err.message);
  }
}
function renderProcList(){
  const el=$('procList');
  if(!el)return;
  if(!procJobs.length){
    el.innerHTML='';
    return;
  }
  el.innerHTML=procJobs.map(j=>{
    const stages=PARSE_STAGES.map((s,i)=>{
      const done=i<j.stage || (j.done && i<=j.stage),active=i===j.stage&&!j.done;
      return `
        <div class="stg ${done?'done':''} ${active?'active':''}">
          <div class="ring">${done?'✓':active?'◴':i+1}</div>
          <div class="lbl">${s.lbl.replace('\\n','<br>')}</div>
        </div>
      `;
    }).join('');
    return `
      <div class="proc-card">
        <div class="pc-top">
          <span class="pc-ft">${esc(j.ft)}</span>
          <span class="pc-name">${esc(j.name)}</span>
          <span class="pc-state">${j.built?'已建 Wiki':j.done?'已完成':'处理中'}</span>
        </div>
        <div class="stages">${stages}</div>
        <div class="file-meta" style="margin-top:10px">
          <span class="mini">Job ${esc(j.jobId)}</span>
          <span class="mini">${esc(j.stageKey)}</span>
          <span class="mini">${esc(String(j.progress))}%</span>
        </div>
        <button class="btn build-wiki ${j.done&&!j.built?'show':''}" onclick="buildUploadedWiki('${j.id}')">
          ⚡ 生成 Workspace Wiki 页面
        </button>
      </div>
    `;
  }).join('');
}
async function buildUploadedWiki(id){
  try{
    const result=await api(`/api/sources/${id}/build-wiki`,{method:'POST'});
    await loadBootstrap();
    activeWiki=result.wikiPage.id;
    activeFile=result.source.id;
    renderLeft();
    switchNav('wiki');
    toast('Workspace Wiki 页面已生成');
  }catch(err){
    toast(err.message);
  }
}

/* ---------------- Grounded QA Core ---------------- */
function normalizeText(s){
  return String(s||'').toLowerCase();
}
function unique(arr){
  return [...new Set(arr)];
}

/**
 * 意图识别：实体命中不等于可答。
 * 例如“台积电26年营收预测”必须识别为 revenue_forecast。
 */
function detectQuestionIntent(q){
  const raw=String(q||'').toLowerCase();
  const intents=[];

  if(/营收|收入|revenue|sales|营业收入|财收|业绩预测|营收预测|收入预测|forecast|guidance|指引|预估|预测|26年|2026|2026年|二六年/.test(raw)){
    intents.push('revenue_forecast');
  }

  if(/利润|毛利|毛利率|净利|eps|盈利|profit|margin/.test(raw)){
    intents.push('profit_margin');
  }

  if(/股价|估值|pe|市值|目标价|valuation|price target/.test(raw)){
    intents.push('valuation_market');
  }

  if(/n2|gaa|制程|节点|风险试产|量产|process node/.test(raw)){
    intents.push('process_node');
  }

  if(/cowos|封装|hbm|chiplet|先进封装|产业链|供应链|基板|设备/.test(raw)){
    intents.push('packaging_supply_chain');
  }

  if(/客户|nvidia|英伟达|apple|amd|qualcomm|客户结构/.test(raw)){
    intents.push('customer_relationship');
  }

  if(/专家|重点|重要性|本体|expert|priority/.test(raw)){
    intents.push('expert_ontology');
  }

  if(/对比|比较|差异|不同|compare|versus|vs/.test(raw)){
    intents.push('comparison');
  }

  if(/时间线|事件|扩产|计划|roadmap|timeline/.test(raw)){
    intents.push('timeline_event');
  }

  return unique(intents);
}

/**
 * 每类意图必须在证据中出现的关键词。
 * 注意：对于 strict intent，不能只凭 query 里的词算证据，必须 evidenceText 包含。
 */
const INTENT_EVIDENCE_KEYWORDS={
  revenue_forecast:[
    '营收','收入','revenue','sales','营业收入','营收预测','收入预测',
    'forecast','guidance','指引','预估','预测','2026 revenue','26年营收','2026年营收'
  ],
  profit_margin:[
    '利润','毛利','毛利率','净利','eps','profit','margin','盈利'
  ],
  valuation_market:[
    '股价','估值','pe','市值','目标价','valuation','price target'
  ],
  process_node:[
    'n2','gaa','制程','节点','风险试产','量产','euv','process'
  ],
  packaging_supply_chain:[
    'cowos','封装','hbm','chiplet','产业链','供应链','基板','设备','先进封装'
  ],
  customer_relationship:[
    '客户','nvidia','英伟达','apple','amd','qualcomm','customer'
  ],
  expert_ontology:[
    '专家','重点','重要性','本体','expertweight','expertnote','expert'
  ],
  comparison:[
    '对比','比较','差异','不同','compare','versus','vs'
  ],
  timeline_event:[
    '时间线','事件','扩产','计划','roadmap','timeline','量产规划'
  ]
};

function isStrictEvidenceIntent(intent){
  return [
    'revenue_forecast',
    'profit_margin',
    'valuation_market'
  ].includes(intent);
}

/**
 * 意图证据检查。
 * strict intent 必须由 evidenceText 支撑。
 */
function intentEvidenceExists(intent,evidence,q){
  const keywords=INTENT_EVIDENCE_KEYWORDS[intent]||[];
  if(!keywords.length)return true;

  const evidenceText=evidence.map(e=>normalizeText(e.text)).join(' ');

  return keywords.some(k=>{
    const kk=normalizeText(k);
    return evidenceText.includes(kk);
  });
}

function buildKnowledgeIndex(){
  const docs=[];

  Object.values(wikiPages).forEach(w=>{
    const text=[
      w.title,w.type,w.summary,
      ...w.entities,
      ...w.sections.flat(),
      ...w.relations.flat()
    ].join(' ');
    docs.push({
      kind:'wiki',
      id:w.id,
      title:w.title,
      source:w.source,
      text,
      payload:w
    });
  });

  files.forEach(f=>{
    const text=[f.title,f.name,f.source,f.abstract,...f.facts].join(' ');
    docs.push({
      kind:'source',
      id:f.id,
      title:f.title,
      source:f.name,
      text,
      payload:f
    });
  });

  ontoNodes.forEach(n=>{
    const related=ontoEdges.filter(e=>e[0]===n.id||e[1]===n.id).flat().join(' ');
    const text=[n.id,n.type,n.wiki,n.expertNote,related].join(' ');
    docs.push({
      kind:'ontology',
      id:n.id,
      title:n.id,
      source:'Ontology Graph',
      text,
      payload:n
    });
  });

  return docs;
}

function tokenizeQuestion(q){
  const raw=String(q||'').toLowerCase();

  const terms=[
    '台积电','tsmc','n2','n3','n5','cowos','gaa','hbm','nvidia','英伟达','apple','amd','qualcomm',
    'arizona','fab','euv','光刻','光刻胶','chiplet','soc','hpc','ai','先进封装','制程','产业链',
    '供应链','风险试产','量产','客户','基板','设备','专家','重点','本体','重要性',

    '营收','收入','revenue','sales','营业收入','营收预测','收入预测','forecast','guidance',
    '指引','预估','预测','2026','2026年','26年','二六年','利润','毛利','估值','股价'
  ];

  const hits=terms.filter(t=>raw.includes(t.toLowerCase()));
  const cnTokens=(raw.match(/[\u4e00-\u9fa5a-z0-9]{2,}/g)||[]).filter(x=>x.length>=2);

  return unique([...hits,...cnTokens]).slice(0,32);
}

function retrieveEvidence(q){
  const tokens=tokenizeQuestion(q);
  const intents=detectQuestionIntent(q);
  const docs=buildKnowledgeIndex();

  const scored=docs.map(d=>{
    const text=normalizeText(d.text);
    let score=0;

    tokens.forEach(t=>{
      const tt=normalizeText(t);
      if(text.includes(tt)) score+=2;
    });

    /**
     * 专家权重只辅助排序，不能作为 strict intent 的充分证据。
     */
    if(d.kind==='ontology'){
      score+=(d.payload.expertWeight||1)*0.20;
    }

    if(/专家|重点|重要性|本体/.test(q) && d.kind==='ontology'){
      score+=1.5;
    }

    /**
     * 严格意图如果文档中没有意图关键词，降权。
     */
    intents.forEach(intent=>{
      if(isStrictEvidenceIntent(intent)){
        const kws=INTENT_EVIDENCE_KEYWORDS[intent]||[];
        const hasIntentKeyword=kws.some(k=>text.includes(normalizeText(k)));
        if(!hasIntentKeyword){
          score-=3;
        }
      }
    });

    return {...d,score};
  }).filter(d=>d.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,8);

  return scored;
}

function canAnswer(q,evidence){
  if(!q.trim())return false;
  if(!evidence.length){
    window.__refuseReason='当前知识库没有检索到任何相关 Workspace Wiki、源文档片段或本体关系。';
    return false;
  }

  const intents=detectQuestionIntent(q);

  const meaningful=evidence.some(e=>e.score>=2);
  if(!meaningful){
    window.__refuseReason='当前知识库只存在非常弱的匹配，无法形成可靠证据。';
    return false;
  }

  /**
   * 没识别出特殊意图时，允许普通实体问答。
   */
  if(!intents.length)return meaningful;

  /**
   * 每个意图都要检查 evidence 里是否有对应主题证据。
   */
  for(const intent of intents){
    const exists=intentEvidenceExists(intent,evidence,q);

    if(isStrictEvidenceIntent(intent) && !exists){
      window.__refuseReason=`当前知识库可能命中了相关实体，但没有找到“${intent}”所需的财务预测、数值、指引或估值类证据。`;
      return false;
    }

    if(!exists){
      window.__refuseReason='当前知识库没有找到与问题意图匹配的证据。';
      return false;
    }
  }

  return true;
}

      citations:unique([...citations,`wiki:${w.title}`,`source:${w.source}`]).slice(0,5)

    const w=wikiPages.tsmc;
    const node=ontoNodes.find(n=>n.id==='台积电');

function refuseAnswer(q){
  const reason=window.__refuseReason || '它没有命中当前 XinWiki 工作空间中的 Workspace Wiki、源文档片段或本体关系。';

  const msg=`抱歉，我不能回答这个问题。${reason} 为避免凭空生成，我已拒绝回答。请先上传包含该问题证据的文档，或在 Workspace Wiki 中补充相关内容后再提问。`;

  lastAnswer='';
  lastQuestion=q;
  lastCitations=[];
  window.__refuseReason='';
  return msg;
}

async function ask(){
  return askStream();
}
async function askStream(){
  const input=$('askInput'),q=input.value.trim();
  if(!q)return;

  const body=$('chatBody');
  body.insertAdjacentHTML('beforeend',`<div class="msg user">${esc(q)}</div>`);
  input.value='';

  // 创建助手消息占位
  const assistantMsg=document.createElement('div');
  assistantMsg.className='msg assistant';
  assistantMsg.innerHTML='<span class="streaming-cursor">▌</span>';
  body.appendChild(assistantMsg);
  body.scrollTop=body.scrollHeight;

  let fullAnswer='';
  let citations=[];

  try{
    const response=await fetch('/api/chat/message/stream',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q}),
      credentials:'same-origin',
    });

    if(!response.ok){
      throw new Error(`HTTP ${response.status}`);
    }

    const reader=response.body.getReader();
    const decoder=new TextDecoder();
    let buffer='';

    while(true){
      const {done,value}=await reader.read();
      if(done)break;

      buffer+=decoder.decode(value,{stream:true});
      const lines=buffer.split('\n');
      buffer=lines.pop()||'';

      for(const line of lines){
        if(line.startsWith('data: ')){
          const data=line.slice(6).trim();
          if(!data)continue;

          try{
            const parsed=JSON.parse(data);
            if(parsed.event==='message_end'){
              fullAnswer=parsed.answer||fullAnswer;
              citations=parsed.citations||citations;
            }else if(parsed.answer){
              fullAnswer+=parsed.answer;
            }else if(parsed.event==='error'){
              fullAnswer+=`\n\n[错误: ${parsed.message}]`;
            }
          }catch{
            // 忽略非 JSON 数据
          }

          // 实时渲染
          assistantMsg.innerHTML=renderChatMessage({
            role:'assistant',
            content:fullAnswer,
            citations:citations,
          })+'<span class="streaming-cursor">▌</span>';
          body.scrollTop=body.scrollHeight;
        }
      }
    }
  }catch(err){
    assistantMsg.innerHTML=renderChatMessage({
      role:'assistant',
      content:fullAnswer||`请求失败: ${err.message}`,
      citations:citations,
    });
  }

  // 移除光标
  assistantMsg.innerHTML=renderChatMessage({
    role:'assistant',
    content:fullAnswer,
    citations:citations,
  });

  // 重新加载消息列表
  try{
    const result=await api('/api/chat/messages');
    chatThread=result.thread||chatThread;
    chatMessages=result.messages||chatMessages;
  }catch{}

  lastQuestion=q;
  lastAnswer=fullAnswer;
  lastCitations=citations;

  const d=$('qaDraft');
  if(d)d.value=`Q: ${q}\n\nA: ${fullAnswer}\n\nCitations: ${(citations||[]).join(' | ')}`;
}
function fillLastAnswer(){

    : '暂无最近有效回答。';
}

async function generateDoc(type){
  const out=$('genOutput');
  if(type==='export'){
    out.innerHTML=`<div class="card pad">导出中…</div>`;
    try{
      const [docx,pdf]=await Promise.all([
        api('/api/reports/export',{
          method:'POST',
          body:JSON.stringify({
            scope:activeScope,
            reportType:activeReportType,
            chartType:activeChart,
            model:activeModel,
            exportFormat:'docx'
          })
        }),
        api('/api/reports/export',{
          method:'POST',
          body:JSON.stringify({
            scope:activeScope,
            reportType:activeReportType,
            chartType:activeChart,
            model:activeModel,
            exportFormat:'pdf'
          })
        })
      ]);
      renderExportOutput([docx,pdf]);
      toast('Word / PDF 已生成');
    }catch(err){
      out.innerHTML=`<div class="card pad" style="color:var(--danger)">${esc(err.message)}</div>`;
    }
    return;
  }
  out.innerHTML=`<div class="card pad">报告生成中…</div>`;
  try{
    const payload=await api('/api/reports/generate',{
      method:'POST',
      body:JSON.stringify({
        scope:activeScope,
        reportType:activeReportType,
        chartType:activeChart,
        model:activeModel,
        format:type
      })
    });
    renderReportOutput(type,payload);
  }catch(err){
    out.innerHTML=`<div class="card pad" style="color:var(--danger)">${esc(err.message)}</div>`;
  }
}

/* ---------------- Search ---------------- */
function wireSearch(){
  const input=$('searchInput');

  input.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const q=input.value.trim().toLowerCase();
    if(!q)return;

    const wikiHit=Object.values(wikiPages).find(w=>
      w.title.toLowerCase().includes(q)||
      w.summary.toLowerCase().includes(q)||
      w.entities.some(x=>x.toLowerCase().includes(q))
    );
    if(wikiHit){
      activeWiki=wikiHit.id;
      switchNav('wiki');
      toast('跳转 Wiki：'+wikiHit.title);
      return;
    }

    const fileHit=files.find(f=>
      f.title.toLowerCase().includes(q)||
      f.abstract.toLowerCase().includes(q)||
      f.name.toLowerCase().includes(q)
    );
    if(fileHit){
      activeFile=fileHit.id;
      switchNav('sources');
      toast('跳转来源：'+fileHit.title);
      return;
    }

    const nodeHit=ontoNodes.find(n=>n.id.toLowerCase().includes(q)||n.type.toLowerCase().includes(q));
    if(nodeHit){
      activeNode=nodeHit.id;
      switchNav('ontology');
      toast('跳转本体节点：'+nodeHit.id);
      return;
    }

    toast('未找到。试试：台积电 / N2 / CoWoS / HBM / GAA');
  });

  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
      e.preventDefault();
      input.focus();
    }
  });
}
